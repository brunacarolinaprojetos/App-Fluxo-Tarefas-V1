# Atendimento por IA: o backend cria a issue (origin:app) e faz o dispatch explícito deste workflow.
# O controlador e as instruções vêm sempre da branch padrão; título, corpo e respostas da IA são dados.
name: ai-agents

on:
  issues:
    types: [opened]
  # Merge feito por uma pessoa (AUTO_MERGE=false): dispara a entrega. pull_request_target roda a definição
  # da branch padrão e este workflow nunca faz checkout do código do PR com permissão de escrita.
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Número da issue do ticket
        required: true
        type: string
      retomar:
        description: Retomar uma execução em fase incerto/erro (pode gerar nova chamada paga)
        type: boolean
        default: false

permissions: {}

# Uma execução por issue de cada vez; a seguinte relê o estado e não repete etapas concluídas.
concurrency:
  group: ai-agents-issue-${{ github.event.issue.number || inputs.issue_number || github.event.pull_request.head.ref }}
  cancel-in-progress: false

env:
  ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
  AGENT_DRY_RUN: ${{ vars.AGENT_DRY_RUN || 'true' }}

jobs:
  coordenar:
    if: >-
      vars.AGENT_RUNTIME == 'github-actions' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'origin:app'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      proposta: ${{ steps.publicar.outputs.proposta }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      - id: preparar
        name: Validar origem e montar entrada
        run: node scripts/agentes/controlador.mjs preparar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_GITHUB_LOGIN: ${{ vars.APP_GITHUB_LOGIN }}
          RETOMAR: ${{ inputs.retomar || 'false' }}

      - id: ia
        name: Chamar o coordenador (IA)
        if: steps.preparar.outputs.seguir == 'true'
        timeout-minutes: 7
        run: node scripts/agentes/controlador.mjs chamar-ia
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MAX_CALLS: ${{ vars.AI_MAX_CALLS || '2' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - id: publicar
        name: Validar e publicar resultado
        if: always() && steps.preparar.outputs.seguir == 'true'
        run: node scripts/agentes/controlador.mjs publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always() && steps.preparar.outputs.seguir == 'true'
        with:
          name: resultado-issue-${{ env.ISSUE_NUMBER }}
          path: .agentes/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # Aplica só as alterações já validadas e abre o PR. Não roda código gerado e não recebe a chave da IA.
  propor-pr:
    needs: coordenar
    if: needs.coordenar.outputs.proposta == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: resultado-issue-${{ env.ISSUE_NUMBER }}
          path: .agentes/
      - id: pr
        run: node scripts/agentes/controlador.mjs abrir-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}

  # Verificação mínima da aula, no commit exato do PR: instalação pelo lockfile, build e testes existentes.
  # Isolado: sem segredos e só com leitura.
  build-proposta:
    needs: propor-pr
    if: needs.propor-pr.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.propor-pr.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build 2>&1 | tee build.log
      - run: npm test 2>&1 | tee -a build.log
      # Só o final do log segue para o pedido de correção (dado, não instrução).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ needs.propor-pr.outputs.sha }}
          path: build.log
          retention-days: 7

  # Registra o resultado na issue e confere o aceite (origem do PR, requestId, caminhos, build do commit).
  # Usa o controlador da branch padrão; não executa o código candidato.
  registrar-build:
    needs: [propor-pr, build-proposta]
    if: always() && needs.propor-pr.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Escrita só para o que este passo faz: merge opcional (contents/pull-requests), comentários (issues)
    # e o dispatch da única rodada de correção (actions).
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        if: needs.build-proposta.result == 'failure'
        continue-on-error: true
        with:
          name: build-log-${{ needs.propor-pr.outputs.sha }}
          path: .agentes/
      - run: node scripts/agentes/controlador.mjs registrar-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build-proposta.result }}
          BUILD_SHA: ${{ needs.propor-pr.outputs.sha }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          AUTO_MERGE: ${{ vars.AUTO_MERGE || 'false' }}

  # Entrega depois do merge confirmado na main: resposta do N1 com ID estável e fechamento da issue.
  # Também é a retomada: workflow_dispatch numa issue já integrada refaz só resposta/fechamento.
  entregar:
    needs: coordenar
    if: >-
      always() && vars.AGENT_RUNTIME == 'github-actions' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request_target' && github.event.pull_request.merged &&
        startsWith(github.event.pull_request.head.ref, 'ai/issue-') &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/agentes/controlador.mjs entregar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
